name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install openpyxl

      - name: Run JS calculation tests
        run: node tests/calc.test.mjs

      - name: Syntax check app JS
        run: |
          node --check app/app.js
          node --check app/core.js
          node --check app/features.js
          node --check app/extras.js
          node --check app/tools.js
          node --check app/sync.js

      - name: Regenerate Excel (smoke test)
        run: python3 generate_excel.py
